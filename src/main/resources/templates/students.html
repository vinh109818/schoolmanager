<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trường Đại học Đông Á - Quản lý sinh viên</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <style>
        :root { --uda-green: #008542; --uda-green-hover: #006834; --uda-green-subtle: #e8f5e9; --uda-orange: #f37042; --uda-bg: #f5f7fa; --uda-border: #e2e8f0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--uda-bg); color: #1e293b; }
        .app-header { background: #fff; border-bottom: 2px solid var(--uda-green); box-shadow: 0 2px 8px #0000000a; }
        .brand-mark { width: 46px; height: 46px; display: grid; place-items: center; border-radius: 12px; color: #fff; background: var(--uda-green); font-size: 1.45rem; }
        .card-uda { border: 1px solid var(--uda-border); border-top: 4px solid var(--uda-green); border-radius: 8px; box-shadow: 0 4px 12px #00000008; }
        .btn-primary { background: var(--uda-green); border-color: var(--uda-green); }
        .btn-primary:hover { background: var(--uda-green-hover); border-color: var(--uda-green-hover); }
        .text-uda-green { color: var(--uda-green); }
        .student-code { font-family: monospace; font-weight: 700; padding: 4px 8px; color: var(--uda-green); background: var(--uda-green-subtle); border: 1px solid #c8e6c9; border-radius: 6px; }
        .class-badge { padding: 5px 9px; color: #475569; background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 6px; font-weight: 600; }
        .table th { white-space: nowrap; font-size: .78rem; text-transform: uppercase; letter-spacing: .4px; background: #f8fafc; }
        .footer-app { color: #64748b; border-top: 1px solid var(--uda-border); background: #fff; }
    </style>
</head>
<body>
<header class="app-header">
    <div class="container-fluid px-4 py-2 d-flex align-items-center justify-content-between">
        <a href="/students" class="d-flex align-items-center gap-3 text-decoration-none text-dark">
            <span class="brand-mark"><i class="bi bi-mortarboard-fill"></i></span>
            <span><strong class="d-block">TRƯỜNG ĐẠI HỌC ĐÔNG Á</strong><small class="text-secondary">Hệ thống quản lý sinh viên</small></span>
        </a>
        <span class="d-none d-md-inline text-secondary"><i class="bi bi-person-circle me-1"></i>Quản trị viên</span>
    </div>
</header>

<main class="container-fluid px-3 px-lg-5 py-4">
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-4">
        <div>
            <h2 class="fw-bold mb-1">Danh sách sinh viên</h2>
            <p class="text-secondary mb-0">Quản lý hồ sơ sinh viên Đại học Đông Á</p>
        </div>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#studentModal" onclick="openCreateModal()">
            <i class="bi bi-person-plus-fill me-1"></i> Thêm sinh viên
        </button>
    </div>

    <div class="card card-uda mb-4">
        <div class="card-body">
            <div class="row g-2 align-items-center">
                <div class="col-md-8">
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-search text-uda-green"></i></span>
                        <input id="searchInput" type="search" class="form-control" placeholder="Tìm theo mã, họ tên, email hoặc số điện thoại">
                    </div>
                </div>
                <div class="col-md-4 text-md-end">
                    <span id="studentCount" class="text-secondary">Đang tải dữ liệu...</span>
                </div>
            </div>
        </div>
    </div>

    <div class="card card-uda">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead><tr><th class="text-center">STT</th><th>Mã sinh viên</th><th>Họ và tên</th><th>Email</th><th>Điện thoại</th><th>Lớp</th><th class="text-center">Thao tác</th></tr></thead>
                <tbody id="studentTableBody">
                <tr th:each="student, stat : ${students}">
                    <td class="text-center" th:text="${stat.count}"></td>
                    <td><span class="student-code" th:text="${student.studentCode}"></span></td>
                    <td class="fw-semibold" th:text="${student.fullName}"></td>
                    <td th:text="${student.email}"></td><td th:text="${student.phone}"></td>
                    <td><span class="class-badge" th:text="${student.className}"></span></td>
                    <td class="text-center"><button class="btn btn-sm btn-outline-danger" th:attr="data-id=${student.id}" onclick="deleteStudent(this.dataset.id)"><i class="bi bi-trash3"></i></button></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer class="footer-app text-center py-3 mt-5">© 2026 Trường Đại học Đông Á - Hệ thống quản lý sinh viên</footer>

<div class="modal fade" id="studentModal" tabindex="-1" aria-labelledby="studentModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <form id="studentForm">
                <div class="modal-header bg-dark text-white"><h5 id="studentModalLabel" class="modal-title"><i class="bi bi-person-plus me-2"></i>Thêm sinh viên</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <input id="studentId" type="hidden">
                    <div class="mb-3"><label class="form-label">Mã sinh viên</label><input id="studentCode" class="form-control" required maxlength="50"></div>
                    <div class="mb-3"><label class="form-label">Họ và tên</label><input id="fullName" class="form-control" required maxlength="150"></div>
                    <div class="mb-3"><label class="form-label">Email</label><input id="email" type="email" class="form-control" maxlength="150"></div>
                    <div class="row g-3"><div class="col-6"><label class="form-label">Điện thoại</label><input id="phone" class="form-control" maxlength="30"></div><div class="col-6"><label class="form-label">Lớp</label><input id="className" class="form-control" maxlength="100"></div></div>
                </div>
                <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Hủy</button><button id="submitButton" class="btn btn-primary" type="submit">Lưu sinh viên</button></div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    const apiUrl = '/api/students';
    const modal = new bootstrap.Modal(document.getElementById('studentModal'));
    const form = document.getElementById('studentForm');
    let students = [];

    const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    const valueOf = id => document.getElementById(id).value.trim();

    async function loadStudents() {
        const keyword = valueOf('searchInput');
        const response = await fetch(keyword ? `${apiUrl}?keyword=${encodeURIComponent(keyword)}` : apiUrl);
        if (!response.ok) throw new Error('Không thể tải danh sách sinh viên.');
        students = await response.json();
        document.getElementById('studentCount').textContent = `Tổng số: ${students.length} sinh viên`;
        document.getElementById('studentTableBody').innerHTML = students.length ? students.map((s, i) => `
            <tr><td class="text-center">${i + 1}</td><td><span class="student-code">${escapeHtml(s.studentCode)}</span></td>
            <td class="fw-semibold">${escapeHtml(s.fullName)}</td><td>${escapeHtml(s.email)}</td><td>${escapeHtml(s.phone)}</td>
            <td><span class="class-badge">${escapeHtml(s.className)}</span></td><td class="text-center">
            <button class="btn btn-sm btn-outline-success me-1" onclick="openEditModal('${s.id}')"><i class="bi bi-pencil"></i></button>
            <button class="btn btn-sm btn-outline-danger" onclick="deleteStudent('${s.id}')"><i class="bi bi-trash3"></i></button></td></tr>`).join('')
            : '<tr><td colspan="7" class="text-center text-secondary py-5"><i class="bi bi-person-exclamation fs-1 d-block mb-2"></i>Chưa có sinh viên.</td></tr>';
    }

    function openCreateModal() {
        form.reset(); document.getElementById('studentId').value = '';
        document.getElementById('studentModalLabel').innerHTML = '<i class="bi bi-person-plus me-2"></i>Thêm sinh viên';
    }
    function openEditModal(id) {
        const student = students.find(item => String(item.id) === String(id)); if (!student) return;
        document.getElementById('studentId').value = student.id; document.getElementById('studentCode').value = student.studentCode ?? '';
        document.getElementById('fullName').value = student.fullName ?? ''; document.getElementById('email').value = student.email ?? '';
        document.getElementById('phone').value = student.phone ?? ''; document.getElementById('className').value = student.className ?? '';
        document.getElementById('studentModalLabel').innerHTML = '<i class="bi bi-pencil me-2"></i>Cập nhật sinh viên'; modal.show();
    }
    form.addEventListener('submit', async event => {
        event.preventDefault();
        const id = valueOf('studentId'); const method = id ? 'PUT' : 'POST';
        const response = await fetch(id ? `${apiUrl}/${id}` : apiUrl, { method, headers: {'Content-Type':'application/json'}, body: JSON.stringify({
            studentCode: valueOf('studentCode'), fullName: valueOf('fullName'), email: valueOf('email'), phone: valueOf('phone'), className: valueOf('className')
        })});
        if (!response.ok) { Swal.fire('Lỗi', 'Không thể lưu thông tin sinh viên.', 'error'); return; }
        modal.hide(); await loadStudents(); Swal.fire({toast:true, position:'top-end', timer:2200, showConfirmButton:false, icon:'success', title:id?'Đã cập nhật sinh viên':'Đã thêm sinh viên'});
    });
    async function deleteStudent(id) {
        const student = students.find(item => String(item.id) === String(id));
        const result = await Swal.fire({title:'Xác nhận xóa?', text:`Bạn có chắc muốn xóa "${student?.fullName ?? 'sinh viên này'}"?`, icon:'warning', showCancelButton:true, confirmButtonColor:'#d33', confirmButtonText:'Đồng ý xóa', cancelButtonText:'Hủy'});
        if (!result.isConfirmed) return;
        const response = await fetch(`${apiUrl}/${id}`, {method:'DELETE'});
        if (!response.ok) { Swal.fire('Lỗi', 'Không thể xóa sinh viên.', 'error'); return; }
        await loadStudents(); Swal.fire({toast:true, position:'top-end', timer:2200, showConfirmButton:false, icon:'success', title:'Đã xóa sinh viên'});
    }
    document.getElementById('searchInput').addEventListener('input', () => loadStudents().catch(error => Swal.fire('Lỗi', error.message, 'error')));
    loadStudents().catch(error => Swal.fire('Lỗi', error.message, 'error'));
</script>
</body>
</html>
