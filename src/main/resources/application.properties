spring.application.name=schoolmanager

# SQL Server connection. These values can be overridden with DB_URL,
# DB_USERNAME, DB_PASSWORD, and DB_DRIVER environment variables.
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=quanlysinhvien;encrypt=true;trustServerCertificate=true;sslProtocol=TLSv1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER:com.microsoft.sqlserver.jdbc.SQLServerDriver}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
