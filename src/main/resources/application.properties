spring.application.name=schoolmanager

# H2 provides a zero-configuration local database. Set DB_URL, DB_USERNAME,
# DB_PASSWORD, and DB_DRIVER to use an external database such as SQL Server.
spring.datasource.url=${DB_URL:jdbc:h2:mem:schoolmanager;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
